version: "3.8"

services:
  event-bus:
    build:
      context: ./event-bus
      dockerfile: Dockerfile
    ports:
      - "${EVENT_BUS_PORT:-5001}:5001"
    environment:
      - EVENT_BUS_PORT=5001
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAX_EVENT_LOG=${MAX_EVENT_LOG:-1000}
      - FLASK_DEBUG=${FLASK_DEBUG:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - GATEWAY_PORT=8080
      - EVENT_BUS_URL=http://event-bus:5001
      - DASHBOARD_URL=http://dashboard:3000
    depends_on:
      event-bus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      - DASHBOARD_PORT=3000
      - EVENT_BUS_URL=http://event-bus:5001
      - GATEWAY_URL=http://api-gateway:8080
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      event-bus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
